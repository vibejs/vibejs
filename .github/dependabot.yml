version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # A parser bump changes compiler output, so it gets a PR of its own (see CONTRIBUTING.md).
      oxc-parser:
        patterns: ['oxc-parser']
      npm:
        patterns: ['*']
    ignore:
      # TypeScript is pinned by hand: one stable pin plus the nightly track (ADR 0004).
      - dependency-name: typescript
      # Node types follow the lowest supported Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # VS Code types must not exceed the extension's minimum engines.vscode.
      - dependency-name: '@types/vscode'
    cooldown:
      default-days: 3
