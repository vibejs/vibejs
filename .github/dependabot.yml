version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript is pinned by hand: one stable pin plus the nightly track (ADR 0004).
      - dependency-name: typescript
      # Node types follow the lowest supported Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 3
